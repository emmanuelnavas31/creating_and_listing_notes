<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mis Notas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
              rel="stylesheet">
        <style>
            @media (max-width: 768px) {
                .container {
                    padding-left: 15px;
                    padding-right: 15px;
                }
                .card {
                    margin: 0.5rem 0 !important;
                }
                h1 {
                    font-size: 1.75rem;
                }
                h2 {
                    font-size: 1.5rem;
                }
                .card-title {
                    font-size: 1.1rem;
                }
                .card-text {
                    font-size: 0.9rem;
                }
            }
        </style>
    </head>
    <body class="bg-light container py-4">
        {% include 'includes/message.html' %}
        <h1 class="text-center text-capitalize my-4">
            <i class="material-icons">edit</i>
            Mis notas
            <i class="material-icons">note</i>
        </h1>
        <form method="post"
              action="{% url 'create_note' %}"
              class="mb-4"
              enctype="multipart/form-data">
            {% csrf_token %}
            <div class="card mx-0 mx-md-3 p-3">
                <div class="mb-3">
                    <label for="title" class="form-label">Título</label>
                    {{ form.titulo }}
                </div>
                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    {{ form.categoria }}
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Contenido</label>
                    {{ form.contenido }}
                    {#        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>#}
                </div>
                <button type="submit" class="btn btn-primary w-100 w-md-auto">Crear Nota</button>
            </div>
        </form>
        <h2 class="text-capitalize mb-3">Notas Recientes</h2>
        <div id="lista-notas" class="row row-cols-1 row-cols-md-3 g-3 mb-4"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                crossorigin="anonymous"></script>
        <script>
    async function cargarNotas() {
        const resp = await fetch('/api/notas/');
        const data = await resp.json();
        const contenedor = document.getElementById('lista-notas');
        contenedor.innerHTML = '';
        data.forEach(nota => {
            contenedor.innerHTML += `
          <div class="col">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title">
                    <i class="material-icons success">check_circle</i>
                    ${nota.titulo}
                </h5>
                <p class="card-text">${nota.contenido}</p>
                <p class="card-text">${nota.categoria}</p>
                <span class="badge bg-secondary">${nota.created_at}</span>
              </div>
            </div>
          </div>
        `;
        });
    }

    cargarNotas();
    setInterval(cargarNotas, 5000); // actualiza cada 5 segundos
        </script>
        <script>
    setTimeout(() => {
        const alertEl = document.querySelector('.alert');
        if (alertEl) {
            alertEl.classList.remove('show');
            alertEl.classList.add('fade');
            setTimeout(() => alertEl.remove(), 300); // eliminarlo del DOM
        }
    }, 3000);
        </script>
    </body>
</html>
